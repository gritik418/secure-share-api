services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: secureshare-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      - db

  db:
    image: postgres:16-alpine

    container_name: secureshare-db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: secureshare
      POSTGRES_PASSWORD: secureshare123
      POSTGRES_DB: secureshare

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
